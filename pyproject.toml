[project]
name = "shingi-27b"
version = "1.0.0"
description = "Local decision API for the Shingi 27B ternary model"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "huggingface_hub>=0.30"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "typesafe-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shingi"]

[project.scripts]
shingi-27b = "shingi.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
